name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      # 1. Install Julia
      - uses: https://github.com/julia-actions/setup-julia@v1
        with:
          version: '1.12' # Update this to your target Julia version
          
      # 2. Cache the Registry, Artifacts, and Precompiled Binaries
      - uses: https://github.com/julia-actions/cache@v1
          
      # 3. Build and Test
      - uses: https://github.com/julia-actions/julia-buildpkg@v1
      - uses: https://github.com/julia-actions/julia-runtest@v1
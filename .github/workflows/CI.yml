name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    
    # THE FIX: Force Julia to use Git for registry downloads to bypass MTU/HTTP stalls
    env:
      JULIA_PKG_SERVER: ""
      
    steps:
      - uses: actions/checkout@v3
      
      - uses: https://github.com/julia-actions/setup-julia@v1
        with:
          version: '1.12' 
          
      - uses: https://github.com/julia-actions/julia-buildpkg@v1
        with:
          ignore-no-cache: true
          
      - uses: https://github.com/julia-actions/julia-runtest@v1